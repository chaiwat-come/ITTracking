services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ittracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run scripts/init-env.sh}

  web:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ittracker?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set - run scripts/init-env.sh}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set - run scripts/init-env.sh}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - DEMO_MODE=${DEMO_MODE:-false}
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    # Start-up (schema sync with retries, seeding, server) is the image's CMD: scripts/start.sh
