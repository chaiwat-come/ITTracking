services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ittracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ittracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run scripts/init-env.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port: only the app container talks to the database (avoids clashing with a local PostgreSQL)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ittracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ittracker_web
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ittracker?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set - run scripts/init-env.sh}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set - run scripts/init-env.sh}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3000
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        until nc -z postgres 5432; do
          echo 'Waiting for postgres...'
          sleep 2
        done &&
        echo 'Database is ready!' &&
        sleep 3 &&
        echo 'Running Prisma commands...' &&
        npx prisma generate &&
        npx prisma db push --accept-data-loss &&
        echo 'Seeding initial admin...' &&
        node scripts/seed-admin.js &&
        echo 'Starting server...' &&
        node server.js
      "
volumes:
  postgres_data:
